name: Daily Security News Crawler

# 언제 실행할 것인가? (동작 조건 2가지)
on:
  # 1. 매일 KST 아침 9시 (UTC 기준 00:00) 마다 자동으로 알아서 실행
  schedule:
    - cron: '43 23 * * *'
  # 2. 깃허브 웹사이트에서 수동으로 버튼을 눌러서 강제로 실행해 볼 수 있도록 허용
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-security-news-pipeline
      cancel-in-progress: false
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_PORT: ${{ secrets.DB_PORT }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    
    steps:
      - name: 백엔드 소스코드 가져오기
        uses: actions/checkout@v3
        
      - name: 파이썬 3.13 가상 컴퓨터 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          
      - name: 크롤러 및 AI 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 뉴스 수집
        run: python crawl_news.py

      - name: AI 기사 생성 (일시 실패 시 1회 재시도)
        run: |
          for attempt in 1 2; do
            if python generate_ai_news.py; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then
              echo "::warning title=AI 뉴스 생성 재시도::10초 후 생성 단계만 다시 실행합니다."
              sleep 10
            fi
          done
          exit 1
