name: Daily Security News Crawler

# 언제 실행할 것인가? (동작 조건 2가지)
on:
  # 1. 매일 KST 아침 9시 (UTC 기준 00:00) 마다 자동으로 알아서 실행
  schedule:
    - cron: "43 23 * * *"
  # 2. 깃허브 웹사이트에서 수동으로 버튼을 눌러서 강제로 실행해 볼 수 있도록 허용
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-security-news-pipeline
      cancel-in-progress: false
    steps:
      - name: 앱 서버의 백엔드 컨테이너에서 뉴스 파이프라인 실행
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SS_HOST }}
          username: ${{ secrets.SS_USERNAME }}
          key: ${{ secrets.SS_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            docker inspect study-back-app >/dev/null
            docker exec study-back-app python crawl_news.py
            for attempt in 1 2; do
              if docker exec study-back-app python generate_ai_news.py; then
                exit 0
              fi
              if [ "$attempt" -lt 2 ]; then
                echo "::warning title=AI 뉴스 생성 재시도::10초 후 생성 단계만 다시 실행합니다."
                sleep 10
              fi
            done
            exit 1
