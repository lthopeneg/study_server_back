name: Daily Security News Crawler

# 언제 실행할 것인가? (동작 조건 2가지)
on:
  # 1. 매일 KST 아침 9시 (UTC 기준 00:00) 마다 자동으로 알아서 실행
  schedule:
    - cron: '0 0 * * *'
  # 2. 깃허브 웹사이트에서 수동으로 버튼을 눌러서 강제로 실행해 볼 수 있도록 허용
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    
    steps:
      - name: 백엔드 소스코드 가져오기
        uses: actions/checkout@v3
        
      - name: 파이썬 3.10 가상 컴퓨터 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 크롤러 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pymysql python-dotenv
          
      - name: 크롤러 스크립트 실행 (오라클 DB에 뉴스 꽂기)
        # 운영 환경에서는 .env 파일이 없으므로, 깃허브 시크릿에 넣어둔 DB 정보를 주입해 줍니다!
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          python crawl_news.py
