name: Deploy Backend to Oracle Cloud

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Cloud via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # 주의: 백엔드 깃허브 저장소에도 동일하게 Secret 변수들을 등록하셔야 합니다!
          host: ${{ secrets.SS_HOST }}
          username: ${{ secrets.SS_USERNAME }}
          key: ${{ secrets.SS_KEY }}
          script: |
            IMAGE_URL="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'):latest"
            
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker pull $IMAGE_URL

            # Caddy가 컨테이너 이름으로 백엔드에 연결할 공용 네트워크를 보장합니다.
            docker network inspect study-network >/dev/null 2>&1 || docker network create study-network

            # 요청 제한 기록은 외부 포트를 열지 않은 전용 Redis에 보존합니다.
            docker volume inspect study-rate-limit-data >/dev/null 2>&1 || docker volume create study-rate-limit-data
            docker inspect study-rate-limit >/dev/null 2>&1 || docker run -d \
              --network study-network \
              --restart unless-stopped \
              -v study-rate-limit-data:/data \
              --name study-rate-limit \
              redis:7-alpine redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
            docker start study-rate-limit >/dev/null

            # Docker가 root 소유로 자동 생성하지 않도록 배포 계정으로 마운트 경로를 준비합니다.
            mkdir -p /home/ubuntu/practice_problems
            
            docker stop study-back-app || true
            docker rm study-back-app || true
            
            # 연구 노트와 Git에서 관리하는 실습 문제를 읽기 전용으로 마운트합니다.
            docker run -d --network study-network \
              -v /home/ubuntu/research_note:/home/ubuntu/research_note \
              -v /home/ubuntu/practice_problems:/data/practice_problems:ro \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_NAME=${{ secrets.DB_NAME }} \
              -e JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }} \
              -e APP_ENV=production \
              -e JWT_COOKIE_SECURE=true \
              -e JWT_COOKIE_CSRF_PROTECT=true \
              -e CORS_ORIGINS=https://scspace.duckdns.org \
              -e PUBLIC_FRONTEND_URL=https://scspace.duckdns.org \
              -e RATELIMIT_STORAGE_URI=redis://study-rate-limit:6379/0 \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e MAIL_USERNAME=${{ secrets.MAIL_USERNAME }} \
              -e MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }} \
              --name study-back-app $IMAGE_URL
